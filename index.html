<!DOCTYPE html>
<html>
<head>
 <title>Trick or Threat</title>
 <link href="https://fonts.googleapis.com/css2?family=Creepster&display=swap" rel="stylesheet">
 <style>
  body {
   background-color:black;
   color: white;
   font-family: Arial, sans-serif;
   text-align: center;
  }
  h1 {
   font-family: 'Creepster', cursive;
   color: orange;
   font-size: 60px;
  }
  button{
   background-color: darkred;
   color: white;
   border: none;
   padding: 12px 20px;
   font-size: 18px;
  }
  #light {
   width: 30px;
   height: 30px;
   background-color: gold;
   border-radius: 50%;
   margin: 20px auto 15px;
   box-shadow: 0 0 40px 15px orange;
   animation: flicker 4s infinite;
  }
  #door {
   position: relative;
   width: 160px;
   height: 280px;
   margin: 0 auto 20px;
   background-color: #4a2c17;
   border: 8px solid #2b1a0e;
   border-radius: 6px 6px 0 0;
  }
  #peephole {
   width: 14px;
   height: 14px;
   background-color: #111;
   border: 3px solid goldenrod;
   margin: 70px auto 0;
   border-radius: 50%;
  }
  #knob {
   position: absolute;
   width: 16px;
   height: 16px;
   background-color: goldenrod;
   border-radius: 50%;
   right: 18px;
   top: 140px;
  }
  @keyframes flicker {
   0% { opacity: 1; }
   90% { opacity: 1;}
   93% { opacity: 0.3;}
   96% { opacity: 1;}
   98% { opacity: 0.4; }
   100% { opacity: 1; }
  }
   
 </style>
</head>
<body>
  <h1>Trick or Threat</h1>
 <div id="light"></div>
 <div id="door">
  <div id="peephole"></div>
  <div id="knob"></div>
 </div>
  <p>Someone is knocking...</p>
  <button>Open the door</button>
  <button>Porch light off</button>
</body>
</html>
