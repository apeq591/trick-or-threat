<!DOCTYPE html>
<html>
<head>
 <title>Trick or Threat</title>
 <link href="https://fonts.googleapis.com/css2?family=Creepster&family=Special+Elite&display=swap"
  rel="stylesheet">
 <style>
  body {
   background: repeating-linear-gradient(90deg, rgba(255, 255, 255, 0.025) 0 2px, transparent 2px 46px), linear-gradient(#18120d, #0f0b08 70%, #060603);
   margin: 0;
   min-height: 100vh;
   display: flex;
   flex-direction: column;
   color: white;
   font-family: 'Special Elite', monospace;
   text-align: center;
  }
  h1 {
   font-family: 'Creepster', cursive;
   color: orange;
   font-size: 60px;
   text-shadow: 0 0 30px rgba(255, 100, 0, 0.6);
  }
  button{
   background-color: darkred;
   color: white;
   border: none;
   padding: 12px 20px;
   font-size: 18px;
   font-family: inherit;
  }
  #light {
   width: 200px;
   height: 4px;
   background-color: gold;
   margin: 0 auto;
   box-shadow: 0 0 15px 4px orange;
   animation: flicker 3s infinite;
  }
  #door {
   position: relative;
   width: 200px;
   height: 350px;
   margin: 0 auto;
   background: linear-gradient(90deg, #3d2412, #4a2c17 50%, #3a2110);
   border: 8px solid #2b1a0e;
   box-shadow: 0 0 0 10px #1e1209, 0 0 40px 10px black;
   border-radius: 6px 6px 0 0;
  }
  #peephole {
   width: 14px;
   height: 14px;
   background-color: #111;
   border: 3px solid goldenrod;
   margin: 90px auto 0;
   border-radius: 50%;
  }
  #knob {
   position: absolute;
   width: 16px;
   height: 16px;
   background: radial-gradient(circle at 35% 35%, #f3d27a, #a57618);
   border-radius: 50%;
   right: 10px;
   top: 180px;
  }
  #switch {
   position: absolute;
   width: 24px;
   height: 40px;
   background: linear-gradient(#e8e2d4, #c2bba9);
   box-shadow: 0 2px 6px black;
   border-radius: 4px;
   right: -70px;
   top: 150px;
  }
  @keyframes flicker {
   0% { opacity: 1; }
   90% { opacity: 1;}
   93% { opacity: 0.1;}
   96% { opacity: 1;}
   98% { opacity: 0.4; }
   100% { opacity: 1; }
  }
  #view {
   display: none;
   position: fixed;
   top: 50%;
   left: 50%;
   transform: translate(-50%, -50%);
   width: 300px;
   height: 300px;
   border-radius: 50%;
   border: 10px solid #111;
   background: radial-gradient(circle, #2a2a3a, black 70%);
   box-shadow: 0 0 0 2000px rgba(0, 0, 0, 0.85);
   font-size: 150px;
   line-height: 300px;
   animation: fadein 0.5s;
   z-index:10;
  }
  #visitor{
   filter: blur(1px);
  }
  @keyframes fadein {
   from { opacity:0; }
   to { opacity: 1; } 
  }
  #floor {
   background: repeating-linear-gradient(90deg, #1c130c 0 120px, #120c07 120px 123px);
   border-top: 10px solid #0d0805;
   box-shadow:inset 0 30px 60px black;
   padding: 30px 0 60px;
   flex-grow:1;
  }
  .panel {
   position: absolute;
   left:32px;
   right: 32px;
   border: 3px solid #2b1a0e;
   box-shadow: inset 0 0 12px #1a0f07;
   pointer-events: none;
  }
  #panel1 {
  top: 30px;
  height: 140px;
}
#panel2 {
  top: 195px;
  height: 135px;
}
#table {
  position: absolute;
  left: -230px;
  bottom: -12px;
  width: 140px;
  height: 90px;
  border-top: 12px solid #3a2414;
  background: linear-gradient(90deg, #2a1a0e 0 10px, transparent 10px 130px, #2a1a0e 130px);
}
#candle {
  position: absolute;
  left: 62px;
  top: -48px;
  width: 14px;
  height: 36px;
  background: linear-gradient(90deg, #d8cfb5, #f3ecd8, #cfc5aa);
}
#flame {
  position: absolute;
  left: 64px;
  top: -64px;
  width: 10px;
  height: 15px;
  background: radial-gradient(circle at 50% 70%, white, gold 40%, orange);
  border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
  box-shadow: 0 0 20px 8px rgba(255, 150, 40, 0.5);
  animation: flicker 2s infinite;
}
#vignette {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: radial-gradient(ellipse, transparent 35%, rgba(0, 0, 0, 0.9));
  pointer-events: none;
  z-index: 5;
}
  .hinge {
  position: absolute;
  left: -6px;
  width: 8px;
  height: 30px;
  background: linear-gradient(90deg, #6b5a3a, #a08a5a, #5a4a2e);
  border-radius: 2px;
}
#hinge1 {
  top: 40px;
}
#hinge2 {
  top: 280px;
}
#letterbox {
  position: absolute;
  left: 60px;
  top: 245px;
  width: 80px;
  height: 16px;
  background: linear-gradient(#c9a24a, #8a6a24);
  border-radius: 3px;
  box-shadow: 0 2px 4px black;
  pointer-events: none;
}
#holder {
  position: absolute;
  left: 50px;
  top: -16px;
  width: 38px;
  height: 6px;
  background: linear-gradient(#c9a24a, #7a5c1e);
  border-radius: 50%;
}
#frame {
  position: absolute;
  right: -250px;
  top: 20px;
  width: 90px;
  height: 115px;
  border: 8px solid #3a2414;
  background: radial-gradient(ellipse at 50% 40%, #2a2420, #0c0a08);
  box-shadow: 0 4px 12px black, inset 0 0 0 2px #5a4020;
}
.screw {
  position: absolute;
  left: 10px;
  width: 4px;
  height: 4px;
  border-radius: 50%;
  background-color: #8a8270;
}
#screw1 {
  top: 4px;
}
#screw2 {
  bottom: 4px;
}
#toggle {
  position: absolute;
  left: 7px;
  top: 12px;
  width: 10px;
  height: 16px;
  background: linear-gradient(#fbf7ee, #d9d2c2);
  border: 1px solid #9a927f;
  border-radius: 2px;
  box-shadow: 0 3px 2px rgba(0, 0, 0, 0.4);
}
 .knocking .panel,
.knocking #knob,
.knocking #letterbox,
.knocking #peephole {
  animation: shake 0.2s 3;
}
@keyframes shake {
  0% { transform: translateX(0); }
  25% { transform: translateX(-3px); }
  75% { transform: translateX(3px); }
  100% { transform: translateX(0); }
}
  #start {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background-color: black;
  z-index: 20;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
}
  #note {
  position: absolute;
  left: 98px;
  top: -38px;
  width: 34px;
  height: 26px;
  background: linear-gradient(#f3ecd8, #cfc3a0);
  transform: rotate(-6deg);
  box-shadow: 0 2px 4px black;
}
#openme {
  position: absolute;
  left: 86px;
  top: -62px;
  font-size: 12px;
  color: #f3ecd8;
  animation: pulse 1.5s infinite;
  pointer-events: none;
}
@keyframes pulse {
  0% { opacity: 1; }
  50% { opacity: 0.2; }
  100% { opacity: 1; }
}
#paper {
  display: none;
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%) rotate(-2deg);
  width: 280px;
  padding: 20px 24px;
  background: linear-gradient(#f3ecd8, #e2d6b5);
  color: #2a1a0e;
  text-align: left;
  box-shadow: 0 0 0 2000px rgba(0, 0, 0, 0.85);
  z-index: 15;
}
 

  
 </style>
</head>
<body>
  <div id="start">
  <h1>Trick or Threat</h1>
  <button id="startbutton">START</button>
 </div>
 <div id="vignette"></div>
  <h1>Trick or Threat</h1>
 <div id="door">
  <div class="panel" id="panel1"></div>
  <div class="panel" id="panel2"></div>
  <div class="hinge" id="hinge1"></div>
<div class="hinge" id="hinge2"></div>
<div id="letterbox"></div>
  <div id="peephole"></div>
  <div id="knob"></div>
  <div id="switch">
  <div class="screw" id="screw1"></div>
  <div id="toggle"></div>
  <div class="screw" id="screw2"></div>
</div>
  <div id="table">
   <div id="candle"></div>
   <div id="flame"></div>
   <div id="holder"></div>
      <div id="note"></div>
   <div id="openme">open me</div>
                    </div>
  <div id="frame"></div>
              
 </div>
 <div id="light"></div>
 <div id="view">
  <div id="visitor">🎃</div>
 </div>
  <div id="paper">
  <h2>Things you need to know</h2>
  <ul>
   <li>Clue 1 goes here</li>
   <li>Clue 2 goes here</li>
   <li>Clue 3 goes here</li>
  </ul>
  <p>Tap to close</p>
 </div>
 <div id="floor">
   <p id="message">All quiet... for now.</p>
  <button>Open the door</button>
  <button>Porch light off</button>
</div>
 <script>
  let peephole = document.getElementById("peephole");
  let view = document.getElementById("view");

  peephole.onclick = function() {
   view.style.display = "block";
  };

  view.onclick = function() {
   view.style.display = "none";
  };
 let message = document.getElementById("message");

  function knock() {
   document.body.classList.add("knocking");
   knockSound.currentTime = 0;
   knockSound.play();
   message.textContent = "Someone is knocking...";
   setTimeout(function() {
    document.body.classList.remove("knocking");
   }, 1000);
  }

    let start = document.getElementById("start");
  let knockSound = new Audio("khemrajdotin%20%E2%80%93%20knock.mp3");

  document.getElementById("startbutton").onclick = function() {
   start.style.display = "none";
   knockSound.play().then(function() {
    knockSound.pause();
    knockSound.currentTime = 0;
   });
  };
  let note = document.getElementById("note");
  let paper = document.getElementById("paper");
  let openme = document.getElementById("openme");
  let firstTime = true;

  note.onclick = function() {
   paper.style.display = "block";
   openme.style.display = "none";
  };

  paper.onclick = function() {
   paper.style.display = "none";
   if (firstTime) {
    firstTime = false;
    setTimeout(knock, 2000);
   }
  };
 </script>
</body>
</html>
