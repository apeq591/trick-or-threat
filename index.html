<!DOCTYPE html>
<html>
<head>
 <title>Trick or Threat</title>
 <link href="https://fonts.googleapis.com/css2?family=Creepster&family=Special+Elite display=swap"
  rel="stylesheet">
 <style>
  body {
   background: repeating-linear-gradient(90deg, rgba(255, 255, 255, 0.025) 0 2px, transperant 2px 46px), linear-gradient(#18120d, #0f0b08 70%, #060603);
   margin: 0;
   min-height: 100vh;
   display: flex;
   flex-direction: column;
   color: white;
   font-family: 'Special Elite', monospace;
   text-align: center;
  }
  h1 {
   font-family: 'Creepster', cursive;
   color: orange;
   font-size: 60px;
   text-shadow: 0 0 30px rgba(255, 100, 0, 0.6);
  }
  button{
   background-color: darkred;
   color: white;
   border: none;
   padding: 12px 20px;
   font-size: 18px;
   font-family: inherit;
  }
  #light {
   width: 200px;
   height: 4px;
   background-color: gold;
   margin: 0 auto;
   box-shadow: 0 0 15px 4px orange;
   animation: flicker 3s infinite;
  }
  #door {
   position: relative;
   width: 200px;
   height: 350px;
   margin: 0 auto;
   background: linear-gradient(90deg, #3d2412, #4a2c17 50%, #3a2110);
   border: 8px solid #2b1a0e;
   border-radius: 6px 6px 0 0;
  }
  #peephole {
   width: 14px;
   height: 14px;
   background-color: #111;
   border: 3px solid goldenrod;
   margin: 90px auto 0;
   border-radius: 50%;
  }
  #knob {
   position: absolute;
   width: 16px;
   height: 16px;
   background: radial-gradient(circle at 35% 35%, #f3d27a, #a57618);
   border-radius: 50%;
   right: 10px;
   top: 180px;
  }
  #switch {
   position: absolute;
   width: 24px;
   height: 40px;
   background-color: #ddd;
   border-radius: 4px;
   right: -70px;
   top: 150px;
  }
  @keyframes flicker {
   0% { opacity: 1; }
   90% { opacity: 1;}
   93% { opacity: 0.1;}
   96% { opacity: 1;}
   98% { opacity: 0.4; }
   100% { opacity: 1; }
  }
  #view {
   display: none;
   position: fixed;
   top: 50%;
   left: 50%;
   transform: translate(-50%, -50%);
   width: 300px;
   height: 300px;
   border-radius: 50%;
   border: 10px solid #111;
   background: radial-gradient(circle, #2a2a3a, black 70%);
   box-shadow: 0 0 0 2000px rgba(0, 0, 0, 0.85);
   font-size: 150px;
   line-height: 300px;
   animation: fadein 0.5s;
   z-index:10;
  }
  #visitor{
   filter: blur(1px);
  }
  @keyframes fadein {
   from { opacity:0; }
   to { opacity: 1; } 
  }
  #floor {
   background: repeating-linear-gradient(90deg, #1c130c 0 120px, #120c07 120px 123px);
   box-shadow:inset 0 30px 60px black;
   padding: 30px 0 60px;
   flex-grow:1;
  }
  .panel {
   position: absolute;
   left;32px;
   right: 32px;
   border: 3px solid #2b1a0e;
   box-shadow: inset 0 0 12px #1a0f07;
   pointers-evenys: none;
  }
  #panel1 {
  top: 30px;
  height: 140px;
}
#panel2 {
  top: 195px;
  height: 135px;
}
#table {
  position: absolute;
  left: -230px;
  bottom: -12px;
  width: 140px;
  height: 90px;
  border-top: 12px solid #3a2414;
  background: linear-gradient(90deg, #2a1a0e 0 10px, transparent 10px 130px, #2a1a0e 130px);
}
#candle {
  position: absolute;
  left: 62px;
  top: -48px;
  width: 14px;
  height: 36px;
  background-color: #e8e0c8;
}
#flame {
  position: absolute;
  left: 64px;
  top: -64px;
  width: 10px;
  height: 15px;
  background-color: gold;
  border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
  box-shadow: 0 0 20px 8px rgba(255, 150, 40, 0.5);
  animation: flicker 2s infinite;
}
#vignette {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: radial-gradient(ellipse, transparent 35%, rgba(0, 0, 0, 0.9));
  pointer-events: none;
  z-index: 5;
}
  
 </style>
</head>
<body>
 <div id="vignette"></div>
  <h1>Trick or Threat</h1>
 <div id="door">
  <div class="panel" id="panel1"></div>
  <div class="panel" id="panel2"></div>
  <div id="peephole"></div>
  <div id="knob"></div>
  <div id="switch"></div>
  <div id="table">
   <div id=:"candle"></div>
   <div id="flame"></div
                    </div>
              
 </div>
 <div id="light"></div>
 <div id="view">
  <div id="visitor">🎃</div>
 </div>
 <div id="floor">
  <p>Someone is knocking...</p>
  <button>Open the door</button>
  <button>Porch light off</button>
</div>
 <script>
  let peephole = document.getElementById("peephole");
  let view = document.getElementById("view");

  peephole.onclick = function() {
   view.style.display = "block";
  };

  view.onclick = function() {
   view.style.display = "none";
  };
 </script>
</body>
</html>
